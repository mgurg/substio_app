[project]
name = "substio-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "coverage>=7.16.2",
    "fastapi[standard]>=0.156.1",
    "httptools>=0.9.0",
    "loguru>=0.7.3",
    "mailersend>=2.1.1",
    "openai>=3.35.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-ai>=2.58.0",
    "pydantic-settings>=2.16.1",
    "requests>=2.34.2",
    "sentry-sdk[fastapi]>=2.72.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "ty>=0.0.90",
    "unidecode>=1.4.0",
    "uvloop>=0.23.0",
    "whenever>=0.11.0",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "datefinder>=1.0.0",
    "dateparser>=1.4.3",
    "geopy>=2.5.0",
    "langcodes>=3.5.1",
    "lxml>=6.1.3",
    "overpy>=0.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "testcontainers>=4.15.0",
    "ty>=0.0.90",
]

[tool.ruff.lint]
preview = true
select = [
    "FAST",
    "ASYNC",
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
    'Q',
    'RUF100',
    'C90', # is too complex ({complexity} > {max_complexity})
    'UP', #  upgrade syntax for newer versions of the language.
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "W191", # indentation contains tabs
]

[tool.ruff]
line-length = 140
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.format]
#quote-style = "single"
#indent-style = "tab"

[tool.ruff.lint.isort]
combine-as-imports = true
known-third-party = ["fastapi", "pydantic", "starlette", "sqlalchemy"]

[tool.uv]
exclude-newer = "P3D"
